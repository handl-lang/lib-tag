# lib-tag atom spec (P-013/T-151) — Tag inspection/dispatch ops — impls are host `Function`s in plugin-lib-stdlib `ops/tag.rs` (`tag_impls()`); `plugin-lib-tag`'s `tag_op_registry` stays for kit-canonical's direct `TagModule` use.
# `sig` = handl signature (~> canonical), `impl` = key for the
# module's impl table, `total` replaces `guarantee: True` decl
# clauses. This file IS the spec (the cap/op/handle decl triples were
# stripped from src/index.hnl in the T-151 migration); the `impl:`
# keys resolve against `tag_impls()` (`RegistrySource::Atoms`, not the
# kernel-ABI `kernel_impls.rs` table).
module: tag
atoms:
  - name: tag.untag
    sig: "Value ~> Value"
    impl: tag_untag
    total: true
  - name: tag.tag_of
    sig: "Value ~> Value"
    impl: tag_tag_of
    total: true
  - name: tag.is_tag
    sig: "Value ~> Bool"
    impl: tag_is_tag
    total: true
  - name: tag.match_type
    sig: "(Value, Value) ~> Value"
    impl: tag_match_type
    total: true
